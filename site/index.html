<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>AI Roles Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">

<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="Open navigation" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    </button>
    <a class="brand" href="#dashboard">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">AI Roles Academy</span>
    </a>
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search 584 lessons  ( / )" autocomplete="off" aria-label="Search lessons">
    </div>
    <nav class="top-links" aria-label="Primary">
      <a href="#review" id="reviewLink" class="top-link">Review <span class="pill pill-count" id="dueCount">0</span></a>
      <a href="#mistakes" class="top-link">Mistakes <span class="pill pill-count" id="mistakeCount">0</span></a>
      <a href="#drill" class="top-link">Drill</a>
      <a href="#settings" class="top-link">Settings</a>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Theme: system">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M9 2.5v13A6.5 6.5 0 0 0 9 2.5z" fill="currentColor"/></svg>
      </button>
    </nav>
  </header>

  <aside class="sidenav" id="sidenav" aria-label="Curriculum">
    <div class="tree" id="tree"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main" tabindex="-1"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
